name: publish-site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify site bundle
        run: |
          curl -fsSL -o site.tgz https://litter.catbox.moe/a7oo3z.tgz
          echo "14f352364fde783325fccde7ecdddcd2148d0c0eeae7061c77404ed02a9b23ab  site.tgz" | sha256sum -c -
          tar xzf site.tgz
          rm site.tgz
      - name: Commit
        run: |
          git config user.name "GemaPdP"
          git config user.email "GemaPdP@users.noreply.github.com"
          git add -A
          git commit -m "Publish portfolio"
          git push
